project_name: stashcli

builds:
  - env:
      - CGO_ENABLED=0        # <- set to 0 globally
    goos:
      - linux
      - windows
      - darwin
      - android
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: android
        goarch: amd64       # skip android/amd64 because it needs CGO

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: 'README.md'
      - src: 'README_ar.md'
      - src: 'README_fa.md'
      - src: 'settings.json'

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:

release:
  github:
    owner: hardgs
    name: stashcli          # no trailing dot